<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>NIC Data Extract</title>
</head>

<body>
    <div class="flex-col">
        <div>
            <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
                <div class="sm:mx-auto sm:w-full sm:max-w-sm">
                    <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500"
                        alt="Your Company" class="mx-auto h-10 w-auto" />
                    <h2 class="mt-10 text-center text-xl/9 font-bold tracking-tight text-gray">EXTRACT DOB FROM SRI LANKAN NIC
                    </h2>
                </div>

                <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
                    <form action="#" method="POST" class="space-y-6">

                        <!-- NIC Input from the user -->
                        <div>
                            <label for="nic" class="block text-sm/6 font-medium text-gray-500">Add Your NIC
                                Number</label>
                            <div class="mt-2">
                                <input id="nic" placeholder="NIC" name="email" required autocomplete="email"
                                    class="block w-full rounded-md border border-gray-300 bg-white/5 px-3 py-1.5 text-base text-gray outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />
                            </div>
                        </div>

                        <!-- Result section -->
                        <div>
                            <div id="resultLabel" class="hidden flex items-center justify-between">
                                <label for="Result" class="block text-sm/6 font-semibold text-indigo-600">Result</label>
                            </div>
                            <div id="showResult"
                                class="hidden border border-indigo-500 bg-indigo-400 text-white p-3 rounded-lg mt-2 font-semibold">
                            </div>
                            <div id="showDOB"
                                class="hidden border border-indigo-500 bg-indigo-400 text-white p-3 rounded-lg mt-2 font-medium">
                            </div>
                            <div id="noteText" class="hidden text-sm text-gray-600 mt-3 italic">
                                Note: Only date of birth and gender can be extracted from a Sri Lankan NIC number
                            </div>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
